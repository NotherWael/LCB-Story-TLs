     data-voiceline="Encounter Start Against Sous Chef|Encounter Start Against Putty|Encounter Start Against Overseer|Encounter Start Against Blackthread of the Elden Sea|S1-1 Crimson Nail|S1-1 Crimson Nail|S1-1 Crimson Nail<br>(Two Coin Variant)|S1-2 Perk Up|S2-1 Go Away|S2-2 Don't Get Hurty|S2-2 Don't Get Hurty|S3-1 Grab my Hand|S3-1 Grab my Hand|S3-2 Baptism of Crimson Nails|S3-2 Baptism of Crimson Nails|S3-3 I'll End It for You<br>(2nd Voiceline plays on Reuse Coin)"  
	 data-translation="<span style='color:#d92121'>소다… 이제는 못먹겠지…<br>The soda... I guess I can't have it anymore...<br>(Soda… Ijeneun motmeokgetji…)</span>|
					  <span style='color:#d92121'>아프게 하는 것 밖에… 방법이 없었던 걸까?<br>Is hurting each other... really the only way?<br>(Apeuge haneun geot bake… Bangbeopi eopeotdeon geolkka?)</span>|
					  <span style='color:#d92121'>…욕심으로 가득한 눈이야. 저자는 나를 따르지 않아.<br>... Eyes full of greed. This one isn't my follower.<br>(… Yoksimeuro gadeukhan nuniya. Jeojaneun nareul ttareuji ana.)</span>|
					  <span style='color:#d92121'>나 때문에 우는 거야…? 내가 꼬무리를… 아프게 해서…?<br>Are you crying because of me...? Because I... hurt Wriggley...?<br>(Na ttaemune uneun geoya…? Naega kkomurireul… Apeuge haeseo…?)</span>|
					  <span style='color:#d92121'>떨어져.<br>Go away.<br>(Tteoleojyeo.)</span>|
					  <span style='color:#d92121'>저리 비켜.<br>Out of my way.<br>(Jeori bikyeo.)</span>|
					  <span style='color:#d92121'>흙으로, 돌아가.<br>Go back... to the dirt.<br>(Heuleuro, Dolaga.)</span>|
					  <span style='color:#d92121'>도와줄게.<br>I'll help you.<br>(Dowajulge.)</span>|
					  <span style='color:#d92121'>다가오지마…<br>Don't get any closer...<br>(Dagaojima…)</span>|
					  <span style='color:#d92121'>아픈 건 싫어.<br>I don't want you to get hurt.<br>(Apeun geon sileo.)</span>|
					  <span style='color:#d92121'>아프지 마.<br>Don't get hurt.<br>(Apeuji ma.)</span>|
					  <span style='color:#d92121'>이젠 괜찮아.<br>You're all right now.<br>(Ijen gwaenchana.)</span>|
					  <span style='color:#d92121'>저물면 안 돼.<br>Don't go down.<br>(Jeomulmyeon an dwae.)</span>|
					  <span style='color:#d92121'>멈출 수 없어. 나는… 더 위로 가야해.<br>You can't stop me. I must... climb higher.<br>(Meomchul su eopeo. Naneun… Deo wiro gayahae.)</span>|
					  <span style='color:#d92121'>이방인들은 강해… 그러니까… 이방인에게 배운 나도 강해.<br>The strangers are strong... I learned from them. So I'm strong, too.<br>(Ibangindeuleun ganghae… Geureonikka… Ibanginege baeun nado ganghae.)</span>|
					  <span style='color:#d92121'>더 멀리. 피크(pique)<br>Farther away. Pique.<br>(Deo meolri. Pikeu(pique))</span>"

	 data-translation="<span style='color:#faee96'>생트르(Cintre). 피크(Pique)!<br>Cintre. Pique!<br>(Saengteureu(Cintre). Pikeu(Pique)!)</span>|
					  <span style='color:#faee96'>재단선을 따라. 꿰매어라.<br>Let us sew along... the lines of the selvage edge.<br>(Jaedanseoneul ttara. Kkwemaeeora.)</span>|
					  <span style='color:#faee96'>르프랑(Reprends) 퓌조(fuseaux) 쿠레(courez)<br>Reprends. Fuseaux. Courez.<br>(Reupeurang(Reprends) Pwijo(fuseaux) Kure(courez))</span>|
					  <span style='color:#faee96'>엉켜버린 것도. 두꺼운 것도. 모두 꿰매어줄게.<br>Bring to me the entangled, the robust... and I'll sew them all up.<br>(Eongkyeobeorin geotdo. Dukkeoun geotdo. Modu kkwemaeeojulge.)</span>|
					  <span style='color:#faee96'>라상블(Rassemble). 쉬르필 아 라 셴(surfiler à la chaîne)!<br>Rassemble. Surfile à la chaîne!<br>(Rasangbeul(Rassemble). Swireupil a ra syen(surfiler à la chaîne)!)</span>|
					  <span style='color:#faee96'>열망으로 가득한 그 눈, 오려내줄게..<br>My scissors will snip around... your burning eyes of desire.<br>(Yeolmangeuro gadeukhan geu nun, Oryeonaejulge..)</span>|
					  <span style='color:#faee96'>나는 묵묵히 천을 깁고, 정갈하게 잘라낼 거야.<br>This is simply where clothes are altered and trimmed.<br>(Naneun mukmukhi cheoneul gipgo, jeonggalhage jalranael geoya.)</span>|
					  <span style='color:#faee96'>무언가를 자르고 싶어. 그게 무엇이라도.<br>It can be anything. I'd just like to go snip-snip...<br>(Mueongareul jareugo sipeo. Geuge mueotirado.)</span>"

	 data-translation="<span style='color:#3bffde'>아… 더 이상 플로어 매니저라는 역할 따위에 욕심을 감추지 않을 거예요. 욕망 실현.<br>Ah... Won't let the responsibilities of the Floor Manager hinder my greed anymore. DESIRE ACTUALIZING.<br>(A… Deo isang peulroeo maenijeoraneun yeokhal ttawie yoksimeul gamchuji aneul geoyeyo. Yokmang silhyeon.)</span>|

     data-voiceline="Encounter Start|S1 Cometh the Nail|S1 Witness Ye in Silence|S3 Proclamation: Sanctum of Conservation<br>(Gaining [Sanctum of Conservation] for the first time)|S3 Proclamation: Sanctum of Conservation|Ally Reinforcement<br>(Turn Start)|Ally Reinforcement after 50% HP<br>(Turn Start)|S3 Proclamation: Sanctum of Conservation<br>(Gaining [Sanctum of Conservation] after 50% HP)|S1 Covenant|S1 Covenant|S3 I sever thine advent.<br>S3 With each smite, I sever thine advent!|Fate Lost by Pwie's Death|???"  
	 data-translation="<span style='color:#ffdc2e'>르루주들이 만들어낸 거짓 우상의 베일을 벗겨내겠노라.<br>I shall draw back the veil that shroudeth the Rouges' false idol.<br>(Reurujudeuli mandeuleonaen geojit usangui beileul beotgyeonaegetnora.)</span>|
					  <span style='color:#ffdc2e'>못을 세우리라.<br>I shall set the nail upright.<br>(Moteul seurira.)</span>|
					  <span style='color:#ffdc2e'>묵시하라.<br>Witness ye in silence.<br>(Muksihara.)</span>|
					  <span style='color:#ffdc2e'>신역 선포. 찬란히 빛나리라.<br>Behold, I proclaim this land a hallowed sanctum. Radiant shall it shine.<br>(Sinyeok seonpo. Chanranhi bitnarira.)</span>|
					  <span style='color:#ffdc2e'>심판 받으라.<br>Judgment upon thee.<br>(Simpan bateura.)</span>|
					  <span style='color:#ffdc2e'>질서대로 행하라.<br>Act ye as order commandeth.<br>(Jilseodaero haenghara.)</span>|
					  <span style='color:#ffdc2e'>여전히… 그 끔찍한 변화를 지지하려는 건가.<br>Thou wouldst still lend thy support to that abhorrent change?<br>(Yeojeonhi… Geu kkeumjjikhan byeonhwareul jijiharyeoneun geonga.)</span>|
					  <span style='color:#ffdc2e'>검은 신의 뜻을 받들어, 응징하리라!<br>By the will of the Obsidian God,
I shall bring His vengeance upon thee!<br>(Geomeun sinui tteuteul batdeuleo, eungjingharira!)</span>|
					  <span style='color:#ffdc2e'>신께서 이르시되<br>And God spake:<br>(Sinkkeseo ireusidoe)</span>|
					  <span style='color:#ffdc2e'>빛을 따르라.<br>Thou shalt follow the light.<br>(Biteul ttareura.)</span>|
					  <span style='color:#ffdc2e'>거듭 내리쳐, 탄생을 끊으리라!<br>With each smite, I sever thine advent!<br>(Geodeup naerichyeo, tansaengeul kkeuneurira!)</span>|
					  <span style='color:#ffdc2e'>마침내 무엇도 탄생하지 않고, 무엇도 고갈되지 않을 터. 백화점에… 영원이 찾아오겠군.<br>At last, naught shall be born, nor aught be depleted. Eternity shall come... unto the department store.<br>(Machimnae mueotdo tansaenghaji ango, mueotdo gogaldoeji aneul teo. Baekhwajeome… Yeongwoni chataogetgun.)</span>|
					  <span style='color:#ffdc2e'>규율을 지켜라. 서약을 이행하라.<br>Thou shalt uphold the rule.
Thou shalt fulfill thy oath.<br>(Gyuyuleul jikyeora. Seoyakeul ihaenghara.)</span>"
