     data-voiceline="Encounter Start Against Sous Chef|Encounter Start Against Putty|Encounter Start Against Overseer|Encounter Start Against Blackthread of the Elden Sea|S1-1 Crimson Nail|S1-1 Crimson Nail|S1-1 Crimson Nail<br>(Two Coin Variant)|S1-2 Perk Up|S2-1 Go Away|S2-2 Don't Get Hurty|S2-2 Don't Get Hurty|S3-1 Grab my Hand|S3-1 Grab my Hand|S3-2 Baptism of Crimson Nails|S3-2 Baptism of Crimson Nails|S3-3 I'll End It for You<br>(2nd Voiceline plays on Reuse Coin)"  
	 data-translation="<span style='color:#d92121'>소다… 이제는 못먹겠지…<br>The soda... I guess I can't have it anymore...<br>(Soda… Ijeneun motmeokgetji…)</span>|
					  <span style='color:#d92121'>아프게 하는 것 밖에… 방법이 없었던 걸까?<br>Is hurting each other... really the only way?<br>(Apeuge haneun geot bake… Bangbeopi eopeotdeon geolkka?)</span>|
					  <span style='color:#d92121'>…욕심으로 가득한 눈이야. 저자는 나를 따르지 않아.<br>... Eyes full of greed. This one isn't my follower.<br>(… Yoksimeuro gadeukhan nuniya. Jeojaneun nareul ttareuji ana.)</span>|
					  <span style='color:#d92121'>나 때문에 우는 거야…? 내가 꼬무리를… 아프게 해서…?<br>Are you crying because of me...? Because I... hurt Wriggley...?<br>(Na ttaemune uneun geoya…? Naega kkomurireul… Apeuge haeseo…?)</span>|
					  <span style='color:#d92121'>떨어져.<br>Go away.<br>(Tteoleojyeo.)</span>|
					  <span style='color:#d92121'>저리 비켜.<br>Out of my way.<br>(Jeori bikyeo.)</span>|
					  <span style='color:#d92121'>흙으로, 돌아가.<br>Go back... to the dirt.<br>(Heuleuro, Dolaga.)</span>|
					  <span style='color:#d92121'>도와줄게.<br>I'll help you.<br>(Dowajulge.)</span>|
					  <span style='color:#d92121'>다가오지마…<br>Don't get any closer...<br>(Dagaojima…)</span>|
					  <span style='color:#d92121'>아픈 건 싫어.<br>I don't want you to get hurt.<br>(Apeun geon sileo.)</span>|
					  <span style='color:#d92121'>아프지 마.<br>Don't get hurt.<br>(Apeuji ma.)</span>|
					  <span style='color:#d92121'>이젠 괜찮아.<br>You're all right now.<br>(Ijen gwaenchana.)</span>|
					  <span style='color:#d92121'>저물면 안 돼.<br>Don't go down.<br>(Jeomulmyeon an dwae.)</span>|
					  <span style='color:#d92121'>멈출 수 없어. 나는… 더 위로 가야해.<br>You can't stop me. I must... climb higher.<br>(Meomchul su eopeo. Naneun… Deo wiro gayahae.)</span>|
					  <span style='color:#d92121'>이방인들은 강해… 그러니까… 이방인에게 배운 나도 강해.<br>The strangers are strong... I learned from them. So I'm strong, too.<br>(Ibangindeuleun ganghae… Geureonikka… Ibanginege baeun nado ganghae.)</span>|
					  <span style='color:#d92121'>더 멀리. 피크(pique)<br>Farther away. Pique.<br>(Deo meolri. Pikeu(pique))</span>"

	 data-translation="<span style='color:#faee96'>생트르(Cintre). 피크(Pique)!<br>Cintre. Pique!<br>(Saengteureu(Cintre). Pikeu(Pique)!)</span>|
					  <span style='color:#faee96'>재단선을 따라. 꿰매어라.<br>Let us sew along... the lines of the selvage edge.<br>(Jaedanseoneul ttara. Kkwemaeeora.)</span>|
					  <span style='color:#faee96'>르프랑(Reprends) 퓌조(fuseaux) 쿠레(courez)<br>Reprends. Fuseaux. Courez.<br>(Reupeurang(Reprends) Pwijo(fuseaux) Kure(courez))</span>|
					  <span style='color:#faee96'>엉켜버린 것도. 두꺼운 것도. 모두 꿰매어줄게.<br>Bring to me the entangled, the robust... and I'll sew them all up.<br>(Eongkyeobeorin geotdo. Dukkeoun geotdo. Modu kkwemaeeojulge.)</span>|
					  <span style='color:#faee96'>라상블(Rassemble). 쉬르필 아 라 셴(surfiler à la chaîne)!<br>Rassemble. Surfile à la chaîne!<br>(Rasangbeul(Rassemble). Swireupil a ra syen(surfiler à la chaîne)!)</span>|
					  <span style='color:#faee96'>열망으로 가득한 그 눈, 오려내줄게..<br>My scissors will snip around... your burning eyes of desire.<br>(Yeolmangeuro gadeukhan geu nun, Oryeonaejulge..)</span>|
					  <span style='color:#faee96'>나는 묵묵히 천을 깁고, 정갈하게 잘라낼 거야.<br>This is simply where clothes are altered and trimmed.<br>(Naneun mukmukhi cheoneul gipgo, jeonggalhage jalranael geoya.)</span>|
					  <span style='color:#faee96'>무언가를 자르고 싶어. 그게 무엇이라도.<br>It can be anything. I'd just like to go snip-snip...<br>(Mueongareul jareugo sipeo. Geuge mueotirado.)</span>"

	 data-translation="<span style='color:#3bffde'>아… 더 이상 플로어 매니저라는 역할 따위에 욕심을 감추지 않을 거예요. 욕망 실현.<br>Ah... Won't let the responsibilities of the Floor Manager hinder my greed anymore. DESIRE ACTUALIZING.<br>(A… Deo isang peulroeo maenijeoraneun yeokhal ttawie yoksimeul gamchuji aneul geoyeyo. Yokmang silhyeon.)</span>|

					  <span style='color:#3bffde'>일할 시간이에요. 죄수 배치.<br>Time to get to work. PRISONERS ASSIGNED.<br>(Ilhal siganieyo. Joesu baechi.)</span>|

					  <span style='color:#3bffde'>기존 소유자의 심장이 더 이상 뛰지 않네요. 소유권 이전.<br>The previous owner's heart has ceased beating. OWNERSHIP TRANSFERRED.<br>(Gijon soyujaui simjangi deo isang ttwiji anneyo. Soyugwon ijeon.)</span>"

	 data-translation="<span style='color:#ffdc2e'>르루주들이 만들어낸 거짓 우상의 베일을 벗겨내겠노라.<br>I shall draw back the veil that shroudeth the Rouges' false idol.<br>(Reurujudeuli mandeuleonaen geojit usangui beileul beotgyeonaegetnora.)</span>|
					  <span style='color:#ffdc2e'>못을 세우리라.<br>I shall set the nail upright.<br>(Moteul seurira.)</span>|
					  <span style='color:#ffdc2e'>묵시하라.<br>Witness ye in silence.<br>(Muksihara.)</span>|
					  <span style='color:#ffdc2e'>신역 선포. 찬란히 빛나리라.<br>Behold, I proclaim this land a hallowed sanctum. Radiant shall it shine.<br>(Sinyeok seonpo. Chanranhi bitnarira.)</span>|
					  <span style='color:#ffdc2e'>심판 받으라.<br>Judgment upon thee.<br>(Simpan bateura.)</span>|
					  <span style='color:#ffdc2e'>질서대로 행하라.<br>Act ye as order commandeth.<br>(Jilseodaero haenghara.)</span>|
					  <span style='color:#ffdc2e'>여전히… 그 끔찍한 변화를 지지하려는 건가.<br>Thou wouldst still lend thy support to that abhorrent change?<br>(Yeojeonhi… Geu kkeumjjikhan byeonhwareul jijiharyeoneun geonga.)</span>|
					  <span style='color:#ffdc2e'>검은 신의 뜻을 받들어, 응징하리라!<br>By the will of the Obsidian God,
I shall bring His vengeance upon thee!<br>(Geomeun sinui tteuteul batdeuleo, eungjingharira!)</span>|
					  <span style='color:#ffdc2e'>신께서 이르시되<br>And God spake:<br>(Sinkkeseo ireusidoe)</span>|
					  <span style='color:#ffdc2e'>빛을 따르라.<br>Thou shalt follow the light.<br>(Biteul ttareura.)</span>|
					  <span style='color:#ffdc2e'>거듭 내리쳐, 탄생을 끊으리라!<br>With each smite, I sever thine advent!<br>(Geodeup naerichyeo, tansaengeul kkeuneurira!)</span>|
					  <span style='color:#ffdc2e'>마침내 무엇도 탄생하지 않고, 무엇도 고갈되지 않을 터. 백화점에… 영원이 찾아오겠군.<br>At last, naught shall be born, nor aught be depleted. Eternity shall come... unto the department store.<br>(Machimnae mueotdo tansaenghaji ango, mueotdo gogaldoeji aneul teo. Baekhwajeome… Yeongwoni chataogetgun.)</span>|
					  <span style='color:#ffdc2e'>규율을 지켜라. 서약을 이행하라.<br>Thou shalt uphold the rule.
Thou shalt fulfill thy oath.<br>(Gyuyuleul jikyeora. Seoyakeul ihaenghara.)</span>"

	 data-translation-link="https://limbuscompany.wiki.gg/wiki/The_Chaplain/Enemy/The_Warden"
     data-voiceline="Encounter Start|S3 Condemnation|S3 Your sinfulness shall constrict you.<br>(Turn Start)|S3 Your sinfulness shall constrict you.|S3 Divine Retribution<br>(Turn Start)|S3 Divine Retribution|Phase 2 Turn Start|S3 Judgment<br>(Clash Start)|S3 Judgment<br>(Clash Start)|S3 Judgment<br>(Clash Start)|S3 Judgment... Sentencing... Condemnation!<br>(First Use Turn Start)|S3 Judgment... Sentencing... Condemnation!<br>(Turn Start)|S3 Judgment... Sentencing... Condemnation!<br>(Clash Start w/ [Stillness] Effect)|S3 Judgment... Sentencing... Condemnation!|S3 Judgment... Sentencing... Condemnation!|S3 Death Unto the Condemned<br>(First Use Turn Start)|S3 Death Unto the Condemned<br>(Turn Start)|S3 Death Unto the Condemned<br>(Clash Start w/ [Thumping Pulse] Effect)|S3 Death Unto the Condemned|S3 Death Unto the Condemned|S3 Death Unto the Condemned"  
	 data-translation="<span style='color:#2d90fa'>영원의 시대가 도래했으니… 죄인은 고통받을지어다…<br>The Age of Eternity hath arrived. Suffer shall the transgressor.<br>(Yeongwonui sidaega doraehaeteuni… Joeineun gotongbateuljieoda…)</span>|
					  <span style='color:#2d90fa'>두려워하라.<br>Thou shalt fear.<br>(Duryeowohara.)</span>|
					  <span style='color:#2d90fa'>무거운 형벌을.<br>Vengeance upon thee.<br>(Mugeoun hyeongbeoleul.)</span>|
					  <span style='color:#2d90fa'>단죄…!<br>Condemned be thou!<br>(Danjoe…!)</span>|
					  <span style='color:#2d90fa'>죄를 직시하고, 징벌을 받으라.<br>Face thy sins. Receive thy punishment.<br>(Joereul jiksihago, jingbeoleul bateura.)</span>|
					  <span style='color:#2d90fa'>순종하라.<br>Obey.<br>(Sunjonghara.)</span>|
					  <span style='color:#2d90fa'>죄인은 기억하라… 참회하지 않는 자… 흙으로 돌아가리라…<br>Let the transgressor bear in mind.
Those who do not repent...
Shall return to dust.<br>(Joeineun gieokhara… Chamhoehaji anneun ja… Heuleuro dolagarira…)</span>|
					  <span style='color:#2d90fa'>죄를 기억하라!<br>Remember thy transgression!<br>(Joereul gieokhara!)</span>|
					  <span style='color:#2d90fa'>회심하라!<br>Repent!<br>(Hoesimhara!)</span>|
					  <span style='color:#2d90fa'>이는 심판의 증거.<br>Behold, the proof of judgment.<br>(Ineun simpanui jeunggeo.)</span>|
					  <span style='color:#2d90fa'>세계가 닫혔으니… 믿음 없는 저항과 도피에 어떤 안식도 없으리라…<br>The world hath been closed...
No rest shall await those who resist without faith and flee from that which is theirs to bear...<br>(Segyega dathyeoteuni… Miteum eopneun jeohanggwa dopie eotteon ansikdo eopeurira…)</span>|
					  <span style='color:#2d90fa'>질서에 순응하라…!<br>Submit to order!<br>(Jilseoe suneunghara…!)</span>|
					  <span style='color:#2d90fa'>자비에 의탁하는가…<br>Dost thou place thy trust in mercy?<br>(Jabie uitakhaneunga…)</span>|
					  <span style='color:#2d90fa'>불의와 거짓으로 가득 찬 죄인의 심장에… 심판의 망치를…!<br>Let the hammer of judgment fall upon thine iniquitous and deceitful heart!<br>(Buluiwa geojiteuro gadeuk chan joeinui simjange… Simpanui mangchireul…!)</span>|
					  <span style='color:#2d90fa'>심판…! 선고…! 단죄…!<br>I judge thee... I sentence thee... I condemn thee...!<br>(Simpan…! Seongo…! Danjoe…!)</span>|
					  <span style='color:#2d90fa'>하루는 천년과 같고… 천년은 하루와 같으니… 죄인은 영원을 헤아리며 죄를 뉘우치라…<br>A day is as a thousand years... and a thousand years as a day. O transgressor, reckon thou eternity, and repent thee of thy sins...<br>(Haruneun cheonnyeongwa gatgo… Cheonnyeoneun haruwa gateuni… Joeineun yeongwoneul hearimyeo joereul nwiuchira…)</span>|
					  <span style='color:#2d90fa'>규율을 따르라…<br>Obey the rules...!<br>(Gyuyuleul ttareura…)</span>|
					  <span style='color:#2d90fa'>거짓된 신의 파편… 죄인은 의무를, 책임을 거두지 말라.<br>Fragment of a false god? Transgressor, lay down not thy duty, nor cast aside thy burden.<br>(Geojitdoen sinui papyeon… Joeineun uimureul, chaekimeul geoduji malra.)</span>|
					  <span style='color:#2d90fa'>영혼은 산산이 부서지리라.<br>Souls shall be broken asunder.<br>(Yeonghoneun sansani buseojirira.)</span>|
					  <span style='color:#2d90fa'>이해치 못한 것에 경외하라.<br>Tremble before that which thou understandest not.<br>(Ihaechi mothan geote gyeongoehara.)</span>|
					  <span style='color:#2d90fa'>우매한 자의 눈을 가리매, 오직 죄만을 직시하라.<br>The eyes of the foolish shall be blinded.
Behold thou naught but thy transgression.<br>(Umaehan jaui nuneul garimae, ojik joemaneul jiksihara.)</span>"

     data-voiceline="Phase 3 Turn Start|Pressing Win Rate ^/ Damage ^ Buttons|Chaining Skills with Nails on them|Viewing The Chaplain's Unit Information More Than 20 Seconds|First Time Clash Losing Against Meursault|First Time Attacking Meursault|S3 &quot;Judgment&quot;<br>(Clash Start)|S3 Do you seriously mean to break the Sisyphe System?<br>(First Use Turn Start)|S3 Do you seriously mean to break the Sisyphe System?<br>(Turn Start)|S3 Do you seriously mean to break the Sisyphe System?|S3 Systemwide Ban<br>(First Use Turn Start)|S3 Systemwide Ban<br>(Turn Start)|S3 Systemwide Ban|S3 Shift + Delete|Turn Start after Durante LUXARIA Cutscene"  
	 data-translation="<span style='color:#fad250'>성대한 방식으로 회개해도 모자를 상황에… 이리 뻗대면 곤란하다고.<br>Honestly, even a big show of repentance wouldn't cut it at this point... Keep digging your heels in like that, and you'll only make things harder for yourself.<br>(Seongdaehan bangsikeuro hoegaehaedo mojareul sanghwange… Iri ppeotdaemyeon gonranhadago.)</span>|
					  <span style='color:#fad250'>자율적인 판단… 그런 말은 이곳에서 쓰이지 않아.<br>&quot;Independent judgment&quot;... Yeah, we don't use words like that around here.<br>(Jayuljeokin pandan… Geureon maleun igoteseo sseuiji ana.)</span>|
					  <span style='color:#fad250'>신의 안배… 뭐, 그런 거야.<br>&quot;God works in mysterious ways,&quot; ... Just like this.<br>(Sinui anbae… Mwo, geureon geoya.)</span>|
					  <span style='color:#fad250'>이봐. 지금 벌 받는 중인 건 기억하지?<br>Hey, did you think you could get a time-out from divine retribution?<br>(Ibwa. Jigeum beol batneun jungin geon gieokhaji?)</span>|
					  <span style='color:#fad250'>이거 기물파손죄인 거 알지?<br>You do know this amounts to criminal damage to property, right?<br>(Igeo gimulpasonjoein geo alji?)</span>|
					  <span style='color:#fad250'>신 앞에는 홀로 서야지.<br>When you stand before god, you do it alone.<br>(Sin apeneun holro seoyaji.)</span>|
					  <span style='color:#fad250'>회개해야지?<br>Aren't you going to repent?<br>(Hoegaehaeyaji?)</span>|
					  <span style='color:#fad250'>영원이 마침내 너희의 절망을 드러내고, 그 죄를 못 박아 새기리라… 라는 거지.<br>&quot;At last, eternity shall lay bare thy despair, and nail thy sin into everlasting record...&quot; That's what I'm getting at.<br>(Yeongwoni machimnae neohuiui jeolmangeul deureonaego, geu joereul mot baka saegirira… Raneun geoji.)</span>|
					  <span style='color:#fad250'>신께서 그리 뜻하셨지.<br>God wills it.<br>(Sinkkeseo geuri tteuthasyeotji.)</span>|
					  <span style='color:#fad250'>직시하도록.<br>Look straight to what you've done.<br>(Jiksihadorok.)</span>|
					  <span style='color:#fad250'>하아… 이제 좀 그만 보고 싶군. 출근할 때마다 너희랑 마주하는 것도 제법 고역이거든.<br>*sigh*... I'm getting pretty tired of dealing with you. Running into your merry band every time I clock in is honestly becoming a real pain.<br>(Haa… Ije jom geuman bogo sipgun. Chulgeunhal ttaemada neohuirang majuhaneun geotdo jebeop goyeokigeodeun.)</span>|
					  <span style='color:#fad250'>신의 앞에서.<br>You're in the presence of god.<br>(Sinui apeseo.)</span>|
					  <span style='color:#fad250'>그래, 모든 것이 끝나겠군.<br>Yeah, this should put an end to it.<br>(Geurae, modeun geoti kkeutnagetgun.)</span>|
					  <span style='color:#fad250'>가져본 적 없는 이해를 쫓느니, 여기서 멈추고 회개하는 게 낫지 않겠어.<br>Why keep chasing after some understanding you've never known? Wouldn't it be easier to give up and repent?<br>(Gajyeobon jeok eopneun ihaereul jjotneuni, yeogiseo meomchugo hoegaehaneun ge natji angeteo.)</span>|
					  <span style='color:#fad250'>…?<br>...?<br>(…?)</span>"

	 data-translation="<span style='color:#ff0a70'>마 퓌스. 삶을 운명으로 바꿀 시간이야.<br>Ma puce. It's time now to turn life into fate.<br>(Ma pwiseu. Saleul unmyeongeuro bakkul siganiya.)</span>|
					  <span style='color:#ff0a70'>멈춰. 너희의 시선으로, 나의… 우리의 세상을 못 박지 마.<br>Stop. Don't nail my world—<i>his</i> and mine—into place with your gaze.<br>(Meomchwo. Neohuiui siseoneuro, naui… Uriui sesangeul mot bakji ma.)</span>|
					  <span style='color:#ff0a70'>바라보지 마. 이해하지도 못하면서, 멋대로 떠올리지 말라고.<br>Stop gazing at me. You understand nothing about me. Stop deciding what I am in your head.<br>(Baraboji ma. Ihaehajido mothamyeonseo, meotdaero tteoolriji malrago.)</span>|
					  <span style='color:#ff0a70'>이대로 영원히 표류한다면… 나는 영영 두렵지 않을 거야.<br>If I can drift like this forever... then I'll never have to be afraid again.<br>(Idaero yeongwonhi pyoryuhandamyeon… Naneun yeongyeong duryeopji aneul geoya.)</span>|
					  <span style='color:#ff0a70'>온 세상을 나의 마음으로, 강렬한 색채로 물들여줄게.<br>I'll color the whole world... with my heart. With my fierce colors.<br>(On sesangeul naui maeumeuro, gangryeolhan saekchaero muldeulyeojulge.)</span>|
					  <span style='color:#ff0a70'>내 마음에 못 박힌 감정… 사명도, 후회도, 책임도 전부! 놓아버리자.<br>The emotions nailed into my heart... Duty? Regret? Responsibility? Let it go. All of it.<br>(Nae maeume mot bakhin gamjeong… Samyeongdo, huhoedo, chaekimdo jeonbu! Notabeorija.)</span>|
					  <span style='color:#ff0a70'>닿지 못했네.<br>You couldn't reach me.<br>(Datji mothaetne.)</span>|
					  <span style='color:#ff0a70'>당신도 이해받고 싶잖아. 그런데 왜 본심을 자꾸 감추고, 그들에게 못 박히려는 건데?  마 퓌스. 오늘만큼은 당신을 정말로… 이해하지 못하겠어. <br>You want to be understood too, don't you? Why bury your heart and offer yourself up to their nails? Ma puce, I'm finding it so hard to understand you today.<br>(Dangsindo ihaebatgo sipjana. Geureonde wae bonsimeul jakku gamchugo, geudeulege mot bakhiryeoneun geonde? Ma pwiseu. Oneulmankeumeun dangsineul jeongmalro… Ihaehaji mothageteo.)</span><br><span style='color:#4564ff'>이해하지 못하기에… 잔느, 너는 나를 이해하려 노력할 것이다. 그러니 나 또한…<br>You cannot understand me, Jeanne... that is why you keep trying. And I will, too...<br>(Ihaehaji mothagie… Janneu, neoneun nareul ihaeharyeo noryeokhal geotida. Geureoni na ttohan…)</span>"

	 data-translation="<span style='color:#ff0a70'>마르슈(Marche)! 코테(côté)! 아상블레(assemblé)!<br>Marche! Côté! Assemblé!<br>(Mareusyu(Marche)! Kote(côté)! Asangbeulre(assemblé)!)</span>|
					  <span style='color:#ff0a70'>앙(Un)! 두(Deux)! 트와(Trois)!<br>Un! Deux! Trois!<br>(Ang(Un)! Du(Deux)! Teuwa(Trois)!)</span>|
					  <span style='color:#ff0a70'>받지 않겠다면, 주지도 말았어야지.<br>You should never have given if you were never going to accept.<br>(Batji angetdamyeon, jujido malateoyaji.)</span>|
					  <span style='color:#ff0a70'>틀렸어. 그 발이 아니잖아!<br>Wrong foot. That's not the step!<br>(Teulryeoteo. Geu bali anijana!)</span>|
					  <span style='color:#ff0a70'>이 템포가 아냐.<br>Not the right tempo.<br>(I tempoga anya.)</span>|
					  <span style='color:#ff0a70'>어때? 아름답지 않아?<br>How do you find it? Isn't it beautiful?<br>(Eottae? Areumdapji ana?)</span>|
					  <span style='color:#ff0a70'>이것 봐. 우리는 서로를 이해하고 있어<br>See? We understand each other.<br>(Igeot bwa. Urineun seororeul ihaehago iteo)</span>|
					  <span style='color:#ff0a70'>마 퓌스. 당신이 있어야만 내 세계도 완전해져.<br>Ma puce... my world can only be complete with you in it.<br>(Ma pwiseu. Dangsini iteoyaman nae segyedo wanjeonhaejyeo.)</span>|
					  <span style='color:#ff0a70'>당신도 이해받고 싶잖아. 그런데 왜 본심을 자꾸 감추고, 그들에게 못 박히려는 건데?  마 퓌스. 오늘만큼은 당신을 정말로… 이해하지 못하겠어. <br>You want to be understood too, don't you? Why bury your heart and offer yourself up to their nails? Ma puce, I'm finding it so hard to understand you today.<br>(Dangsindo ihaebatgo sipjana. Geureonde wae bonsimeul jakku gamchugo, geudeulege mot bakhiryeoneun geonde? Ma pwiseu. Oneulmankeumeun dangsineul jeongmalro… Ihaehaji mothageteo.)</span><br><span style='color:#4564ff'>이해하지 못하기에… 잔느, 너는 나를 이해하려 노력할 것이다. 그러니 나 또한…<br>You cannot understand me, Jeanne... that is why you keep trying. And I will, too...<br>(Ihaehaji mothagie… Janneu, neoneun nareul ihaeharyeo noryeokhal geotida. Geureoni na ttohan…)</span>"

  <a href="#" class="character-voice"
     data-character-title="Moulin Rouge - Jeanne-Marie Sartre"

     data-page="" 
     data-background="assets/Canto10/JeanneP3_BG.png"
	 data-translation-link="https://limbuscompany.wiki.gg/wiki/Jeanne/Enemy"
     data-voiceline="Phase 3 Cutscene|Blueprint Form Changes to Jeanne Sartre, the Sartorial Tailor<br>(Turn Start)|S3 You went off-pattern.|S3 You went off-pattern.|S1 At least on this stage, everything's set and fixed.|Blueprint Unit in Jeanne Sartre, the Sartorial Tailor Form is Killed|Turn Start after using S3 Rights: Ban|Turn Start after using S3 Rights: Ban|Turn Start after using S3 Rights: Ban|Turn Start after using S3 Rights: Ban|S3 Rights: Gaze"  
	 data-translation="<span style='color:#ff0a70'>당신은… 첫걸음에 다가와, 두걸음에 머물러, 세걸음에 멀어졌지. 그럼… 그 다음은? 다음엔 어디로 발을 뻗을 건데? 모르겠다면… 그냥 내 곁으로 돌아와. 당신의 첫걸음처럼.<br>You came to me on the first step, stayed on the second, and drifted away on the third. So... what comes next, then? Where will your foot fall now? Are you lost...? Then just come back to me, like the first step of this dance.<br>(Dangsineun… Cheotgeoleume dagawa, dugeoleume meomulreo, segeoleume meoleojyeotji. Geureom… Geu daeumeun? Daeumen eodiro baleul ppeoteul geonde? Moreugetdamyeon… Geunyang nae gyeoteuro dolawa. Dangsinui cheotgeoleumcheoreom.)</span>|
					  <span style='color:#ff0a70'>다시 춤출 시간이야. 내게 보이는 세계에서. 내가 만들어갈 의미 위에서.<br>Time to resume our dance. Dance in the world as I see it. Dance upon the meaning I will assign.<br>(Dasi chumchul siganiya. Naege boineun segyeeseo. Naega mandeuleogal uimi wieseo.)</span>|
					  <span style='color:#ff0a70'>잊었을 리는 없고… 날 놀리는 거야?<br>You couldn't have forgotten... Is this you teasing me?<br>(Iteoteul rineun eopgo… Nal nolrineun geoya?)</span>|
					  <span style='color:#ff0a70'>너희는, 이 벽에 영영 닿지 못하겠지.<br>None of you will ever reach this wall.<br>(Neohuineun, i byeoke yeongyeong datji mothagetji.)</span>|
					  <span style='color:#ff0a70'>리듬에 맞춰, 강하게, 다시 약하게.<br>Find the rhythm. Forte... and then piano.<br>(Rideume matchwo, ganghage, dasi yakhage.)</span>|
					  <span style='color:#ff0a70'>무엇 하나, 바라보는대로 존재하는 게 없네… 어지러워라.<br>Not a single thing exists as my gaze insists it is... It's so dizzying.<br>(Mueot hana, baraboneundaero jonjaehaneun ge eopne… Eojireowora.)</span>|
					  <span style='color:#ff0a70'>합리성을 따지기엔 늦었어. 무대는, 세상은 원래 공평하지 않거든.<br>It's too late to discuss rationality. The stage—the world—was never fair to begin with.<br>(Hapriseongeul ttajigien neuteoteo. Mudaeneun, sesangeun wonrae gongpyeonghaji angeodeun.)</span>|
					  <span style='color:#ff0a70'>시선에 둘러싸인 당신들이, 어디로 향할 수 있을런지.<br>You people are all hemmed in by gazes. Is there even a place left for you to step?<br>(Siseone dulreossain dangsindeuli, eodiro hyanghal su iteulreonji.)</span>|
					  <span style='color:#ff0a70'>타인은 지옥이야. 마주하고 싶지 않은, 끔찍한 지옥.<br>Hell is other people. A horrible, hideous hell I don't want to face.<br>(Taineun jiokiya. Majuhago sipji aneun, kkeumjjikhan jiok.)</span>|
					  <span style='color:#ff0a70'>생각하지 마. 생각하지 말자는 생각조차 하지 마.<br>Just stop thinking. Stop thinking about not thinking, even.<br>(Saenggakhaji ma. Saenggakhaji maljaneun saenggakjocha haji ma.)</span>|
					  <span style='color:#ff0a70'>나의 불안. 나의 공포… 느껴봐. 낯설게 못 박힌 시선 속 몰이해를.<br>My anxiety. My fears. Feel it—the incomprehension of being nailed under an alienating gaze.<br>(Naui bulan. Naui gongpo… Neukkyeobwa. Natseolge mot bakhin siseon sok molihaereul.)</span>"
